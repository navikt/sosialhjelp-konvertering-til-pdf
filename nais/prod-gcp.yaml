apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sosialhjelp-konvertering-til-pdf
  namespace: teamdigisos
  labels:
    team: teamdigisos
  annotations:
    nais.io/run-as-user: "1001"
spec:
  image: {{ image }}
  port: 3000
  prometheus:
    enabled: true
    path: /metrics
    port: "9464"
  liveness:
    path: /health
    initialDelay: 60
    timeout: 5
    failureThreshold: 10
  accessPolicy:
    inbound:
      rules:
        - application: sosialhjelp-soknad-api
        - application: sosialhjelp-upload
  replicas:
    min: 2
    max: 4
  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
  env:
    - name: OTEL_TRACES_EXPORTER
      value: otlp
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 288Mi
